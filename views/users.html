<!DOCTYPE html>
<html>
<head>
  <title>Select User - ToDo App</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <h1>Select User</h1>
    <ul id="userList"></ul>

    <input type="text" id="newUser" placeholder="Enter new user name">
    <button onclick="addUser()">Add User</button>
  </div>

  <script>
    async function loadUsers() {
      const res = await fetch('/api/users');
      const users = await res.json();

      const ul = document.getElementById('userList');
      ul.innerHTML = '';
      users.forEach(u => {
        const li = document.createElement('li');
        li.innerHTML = `${u.avatar} <b>${u.name}</b> <button onclick="enterTasks('${u._id}', '${u.name}')">Enter</button>`;
        ul.appendChild(li);
      });
    }

    async function addUser() {
      const input = document.getElementById('newUser');
      if (!input.value) return;
      await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: input.value })
      });
      input.value = '';
      loadUsers();
    }

    function enterTasks(userId, name) {
      localStorage.setItem('userName', name);
      window.location.href = `/tasks/${userId}`;
    }

    loadUsers();
  </script>
</body>
</html>
